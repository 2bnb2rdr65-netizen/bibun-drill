<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS単語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>IELTS単語ドリル</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column — step plan, mode tabs, filters, a single index card in focus, progress strip */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#18212e; --muted:#5d6878; --line:#d5dbe3;
  --accent:#1f4fd6; --accent-soft:#e3eafc; --good:#1f8a55; --good-soft:#dff3e8; --bad:#c23a3a; --bad-soft:#fbe5e5;
  --note:#f6f1e2; --note-ink:#5a4a1c;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141b; --paper:#19202b; --ink:#e7ecf3; --muted:#9aa5b5; --line:#2c3543;
  --accent:#7c9dff; --accent-soft:#1f2a47; --good:#5fcf95; --good-soft:#15301f; --bad:#ff8a8a; --bad-soft:#3a1c1c;
  --note:#2a2618; --note-ink:#e6d7a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --paper:#19202b; --ink:#e7ecf3; --muted:#9aa5b5; --line:#2c3543;
  --accent:#7c9dff; --accent-soft:#1f2a47; --good:#5fcf95; --good-soft:#15301f; --bad:#ff8a8a; --bad-soft:#3a1c1c;
  --note:#2a2618; --note-ink:#e6d7a8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding:24px 16px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0}
h1 span{color:var(--accent)}
.stat{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* step plan */
.plan{display:grid;gap:8px}
.plan p{margin:0;font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{font:inherit;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--ink);display:grid;gap:4px;min-width:0}
.step.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.step .b{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.here{font-size:10px;font-weight:700;color:var(--paper);background:var(--accent);border-radius:3px;padding:0 5px;line-height:1.6}
.mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.mini span{display:block;height:100%}

nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
nav button{font:inherit;font-weight:700;font-size:13px;border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.filters label,.qtype{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.04em}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%;min-width:0}

.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.st{border-color:var(--accent);color:var(--accent)}

/* the card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;min-height:320px;padding:22px 24px 20px;position:relative;
  background-image:linear-gradient(var(--paper) 62px,transparent 62px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);
  display:flex;flex-direction:column;cursor:pointer;user-select:none}
.card.open{background-image:none}
.card::before{content:"";position:absolute;left:0;right:0;top:61px;height:2px;background:var(--bad);opacity:.55}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.meta .tags{display:flex;gap:6px;flex-wrap:wrap}
.word{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,54px);letter-spacing:-.025em;line-height:1.05;margin:40px 0 6px;overflow-wrap:anywhere}
.ipa{font-family:var(--mono);font-size:15px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;font:inherit;font-size:12px;padding:2px 10px;cursor:pointer}
.back{margin-top:16px;display:grid;gap:10px;background:var(--paper);padding-top:4px;cursor:auto;user-select:text}
.mean{font-size:21px;font-weight:700}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;min-width:0}
.kv dd.en{font-family:var(--display);font-weight:500}
.note{background:var(--note);color:var(--note-ink);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.7}
.note b{font-size:11px;letter-spacing:.08em;display:block;margin-bottom:2px}
.ex{font-size:14px;color:var(--muted)}
.ex b{color:var(--ink);font-weight:700}
.hint{margin-top:auto;padding-top:16px;font-size:12px;color:var(--muted);text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.no{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.btn.yes{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

/* quiz & spelling */
.q{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column}
.q .word{margin:18px 0 4px}
.qtype{margin-bottom:10px;max-width:260px}
.prompt{font-size:13px;color:var(--muted);margin-top:16px}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{text-align:left;font:inherit;font-size:16px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;gap:12px}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.choice.en span:last-child{font-family:var(--display);font-weight:500;font-size:17px}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;font-size:14px;display:grid;gap:8px}
.feedback:empty{display:none}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}
.listen{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 8px}
.listen .btn{padding:12px 18px}
.spell{display:flex;gap:8px;margin-top:14px}
.spell input{flex:1;min-width:0;font-family:var(--mono);font-size:20px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.spell input.right{border-color:var(--good);background:var(--good-soft)}
.spell input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.diff{font-family:var(--mono);font-size:18px;letter-spacing:.04em}
.diff .x{color:var(--bad);text-decoration:underline}

/* list */
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.topics{display:grid;gap:6px;margin-bottom:18px}
.trow{display:grid;grid-template-columns:9em 1fr 3.5em;gap:10px;align-items:center;font-size:13px}
.trow .n{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.add{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px}
.add h2{font-size:14px;margin:0}
.add input{font:inherit;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.add .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lfilter{display:flex;gap:8px;align-items:center;margin:20px 0 8px;flex-wrap:wrap}
.lfilter h3{margin:0;flex:1}
.lfilter select{width:auto}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 2px;align-items:center;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item .w{font-family:var(--display);font-weight:500;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .m{font-size:13px;color:var(--muted);grid-column:1}
.item .body{display:grid;gap:8px;padding:0 2px 14px}
.lv{grid-row:1/3;grid-column:2;display:flex;gap:3px}
.lv i{width:7px;height:16px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--good)}
.del{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;justify-self:start}
.more{justify-self:center}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--paper);border:1px dashed var(--line);border-radius:6px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:active{transform:scale(.99)}}
@media (max-width:440px){.steps{grid-template-columns:1fr}.step{grid-template-columns:1fr auto;align-items:center}.step .mini{grid-column:1/-1}.trow{grid-template-columns:7.5em 1fr 3em}.kv{grid-template-columns:4.8em 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IELTS <span>単語ドリル</span></h1>
    <div class="stat" id="stat"></div>
  </header>

  <section class="plan" aria-label="学習ステップ">
    <p>英検2級はIELTS Band 5前後が目安です。6.5を取るには、Step 1とStep 2をしっかり定着させましょう。いまのステップの7割が定着すると、「おすすめ」の出題が次のステップに進みます。</p>
    <div class="steps" id="steps"></div>
  </section>

  <nav role="tablist">
    <button role="tab" data-mode="card" aria-selected="true">カード</button>
    <button role="tab" data-mode="quiz" aria-selected="false">クイズ</button>
    <button role="tab" data-mode="spell" aria-selected="false">スペル</button>
    <button role="tab" data-mode="list" aria-selected="false">単語帳</button>
  </nav>

  <div class="filters" id="filters">
    <label>レベル<select id="f-step">
      <option value="auto">おすすめ（自動）</option>
      <option value="1">Step 1 基礎</option>
      <option value="2">Step 2 目標</option>
      <option value="3">Step 3 発展</option>
      <option value="all">すべて</option>
    </select></label>
    <label>トピック<select id="f-topic"></select></label>
    <label>出題<select id="f-set">
      <option value="all">すべて</option>
      <option value="weak">苦手のみ（習熟度2以下）</option>
      <option value="new">未習得のみ</option>
    </select></label>
    <label>発音<select id="f-accent">
      <option value="en-GB">イギリス英語</option>
      <option value="en-AU">オーストラリア英語</option>
      <option value="en-US">アメリカ英語</option>
    </select></label>
  </div>

  <section id="v-card"></section>
  <section id="v-quiz" hidden></section>
  <section id="v-spell" hidden></section>
  <section id="v-list" hidden></section>

  <div class="prog">
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
// [word, IPA (British), 品詞, 意味, 言い換え, よく使う形, 例文, topic, step(1-3), 解説, near-synonym group]
const RAW=[
/* ===== アカデミック基礎語 ===== */
["benefit","ˈbenɪfɪt","名/動","利点、恩恵／恩恵を受ける","advantage, gain","benefit from / the benefits of","Children <b>benefit</b> from spending time outdoors.","core",1,"benefit from 〜 で「〜から恩恵を受ける」。名詞は the benefits of X（Xの利点）の形でTask 2に頻出。advantage と交互に使うと語彙の繰り返しを避けられる。","benefit"],
["issue","ˈɪʃuː","名","（議論すべき）問題","problem, matter","a serious issue","Climate change is one of the most serious <b>issues</b> of our time.","core",1,"problem より中立的で「議論の対象になる問題」。Task 2の問題文に頻出。address / tackle an issue（問題に取り組む）とセットで覚える。"],
["factor","ˈfæktə","名","要因","cause, element","a key factor","Cost is a key <b>factor</b> when choosing a university.","core",1,"いくつかある原因のうちの一つを言うときの定番。the main reason の言い換えに a major factor が使える。"],
["approach","əˈprəʊtʃ","名","取り組み方、方法","method, way","a new approach to","We need a new <b>approach</b> to reducing waste.","core",1,"後ろは to + 名詞／動名詞（approach to reducing）。to reduce としないよう注意。動詞では「近づく」の意味。"],
["significant","sɪɡˈnɪfɪkənt","形","重要な、（数量が）かなりの","considerable, important","a significant increase","There has been a <b>significant</b> rise in online shopping.","core",1,"Task 1では「大きな変化」を表す定番。big の代わりに使うだけで語彙の印象が上がる。副詞 significantly も頻出。"],
["aspect","ˈæspekt","名","側面","feature, part","every aspect of","Technology affects every <b>aspect</b> of our lives.","core",1,"various aspects of 〜（〜のさまざまな側面）の形で、話題を広げるときに使える。"],
["affect","əˈfekt","動","影響を与える","influence, have an impact on","directly affect","Air pollution <b>affects</b> people's health.","core",1,"affect は動詞、effect は名詞（have an effect on）。IELTSで最も多いつづりの混同の一つ。affect on とは言わない。","affect"],
["impact","ˈɪmpækt","名","影響","effect, consequence","have an impact on","Social media has a huge <b>impact</b> on young people.","core",1,"前置詞は on。a positive / negative impact で、良い面と悪い面を整理するのに便利。","affect"],
["require","rɪˈkwaɪə","動","必要とする","need, demand","be required to do","Most jobs now <b>require</b> basic computer skills.","core",1,"need のフォーマル版。受け身の be required to do（〜することが求められる）が使いやすい。"],
["provide","prəˈvaɪd","動","提供する","supply, offer","provide A with B","Schools should <b>provide</b> students with healthy meals.","core",1,"provide A with B（AにBを与える）と provide B for A の2つの形がある。give の言い換え。"],
["increase","ɪnˈkriːs","動/名","増える／増加","rise, grow","an increase in","The number of tourists <b>increased</b> by 20%.","core",1,"動詞は後ろにアクセント（inˈcrease）、名詞は前（ˈincrease）。「〜の増加」は an increase in 〜（of ではない）。「20%増えた」は by 20%。","up"],
["reduce","rɪˈdjuːs","動","減らす","cut, lower","reduce costs","Working from home can <b>reduce</b> traffic.","core",1,"「何かを減らす」他動詞。主語自体が「減る」ときは decrease / fall / decline を使う。","down"],
["available","əˈveɪləbl","形","利用できる、手に入る","accessible, obtainable","widely available","Free Wi-Fi is <b>available</b> in most cafés.","core",1,"名詞の後ろに置く使い方も多い（the information available online）。"],
["individual","ˌɪndɪˈvɪdʒuəl","名/形","個人／個々の","person, single","individuals and governments","Both <b>individuals</b> and governments must take action.","core",1,"Task 2で「個人 vs 政府」を対比するときに必須。people の繰り返しを避けられる。"],
["responsibility","rɪˌspɒnsəˈbɪləti","名","責任","duty, obligation","take responsibility for","Parents have a <b>responsibility</b> to teach their children manners.","core",1,"「誰の責任か」を問うTask 2は頻出。It is the responsibility of governments to 〜 の型を覚えると書きやすい。"],
["evidence","ˈevɪdəns","名","証拠、根拠","proof, data","evidence suggests that","There is strong <b>evidence</b> that exercise improves mood.","core",1,"不可算名詞。an evidence / evidences は誤り。数えるときは a piece of evidence。"],
["analyse","ˈænəlaɪz","動","分析する","examine, study","analyse data","Researchers <b>analysed</b> data from 2,000 students.","core",2,"イギリス式は analyse、アメリカ式は analyze（どちらも正解）。名詞 analysis、複数形 analyses。"],
["trend","trend","名","傾向","tendency, pattern","an upward trend","There is a growing <b>trend</b> towards working from home.","core",1,"Task 1でも2でも使える。an upward / downward trend（上昇／下降傾向）。"],
["crucial","ˈkruːʃl","形","極めて重要な","vital, key","play a crucial role in","Teachers play a <b>crucial</b> role in children's development.","core",1,"important の強い言い換え。play a crucial role in 〜（〜で重要な役割を果たす）は丸ごと覚える。","vital"],
["essential","ɪˈsenʃl","形","不可欠な","necessary, indispensable","it is essential that","Clean water is <b>essential</b> for good health.","core",1,"なくてはならない、という意味。It is essential that S (should) do の形も。","vital"],
["potential","pəˈtenʃl","形/名","起こりうる／潜在能力","possible, likely","potential risks","We must consider the <b>potential</b> risks of AI.","core",1,"形容詞「起こりうる」と名詞「潜在能力（reach one's potential）」の両方で使う。"],
["ensure","ɪnˈʃʊə","動","確実にする","make sure, guarantee","ensure that","Governments should <b>ensure</b> that everyone has access to healthcare.","core",1,"make sure のフォーマル版。insure（保険をかける）と混同しない。"],
["maintain","meɪnˈteɪn","動","維持する","keep, preserve","maintain a healthy lifestyle","It is hard to <b>maintain</b> a healthy diet when you are busy.","core",1,"keep の言い換え。名詞は maintenance で、つづりが変わる点に注意。"],
["obtain","əbˈteɪn","動","得る","get, acquire","obtain information","Students can <b>obtain</b> information easily online.","core",1,"get のフォーマル版。Writingで get を多用しないために覚えておく。"],

["undermine","ˌʌndəˈmaɪn","動","損なう、弱める","weaken, erode","undermine confidence","Fake news <b>undermines</b> public trust in the media.","arg",3,"信頼や努力を少しずつ弱める、というイメージ。","worse"]

const TOPICS={core:"アカデミック基礎語",env:"環境",edu:"教育",tech:"テクノロジー",health:"健康",work:"経済・仕事",soc:"社会・政府",city:"都市・交通",crime:"犯罪・法律",media:"メディア・広告",global:"観光・国際",graph:"Task 1 グラフ描写",arg:"Task 2 論述",mine:"自分で追加"};
const STEPS={1:{name:"Step 1 基礎",band:"〜Band 5.5"},2:{name:"Step 2 目標",band:"Band 6〜6.5"},3:{name:"Step 3 発展",band:"Band 7〜"}};
const SEED=RAW.map(([w,ipa,pos,m,syn,col,ex,t,step,note,g])=>({w,ipa,pos,m,syn,col,ex,t,step,note,g:g||""}));
const SETTLED=3, UNLOCK=0.7;   // 習熟度3以上＝定着、ステップの7割が定着で次へ

/* ---------- storage: progress map + own words + deleted built-ins ---------- */
const KEY="ielts-drill-v1";
let store={lv:{},mine:[],del:[]};
try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(s)){s.forEach(w=>{store.lv[w.w]=w.lv||0});store.mine=s.filter(w=>w.t==="mine")}
  else if(s&&typeof s==="object")store={lv:s.lv||{},mine:s.mine||[],del:s.del||[]};
}catch(e){}
let words=[];
function build(){
  words=SEED.filter(w=>!store.del.includes(w.w)).map(w=>({...w,lv:store.lv[w.w]||0}))
    .concat(store.mine.map(w=>({...w,step:0,lv:store.lv[w.w]||0})));
}
function save(){
  words.forEach(w=>{store.lv[w.w]=w.lv});
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
}
build();

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const syns=w=>(w.syn||"").split(",").map(s=>s.trim()).filter(Boolean);

function stepStats(s){const ws=words.filter(w=>w.step===s);return{n:ws.length,settled:ws.filter(w=>w.lv>=SETTLED).length,mastered:ws.filter(w=>w.lv>=5).length}}
function autoStep(){for(const s of [1,2,3]){const st=stepStats(s);if(st.n&&st.settled/st.n<UNLOCK)return s}return 3}

function fillTopics(){
  const used=new Set(words.map(w=>w.t));const cur=$("f-topic").value;
  $("f-topic").innerHTML=`<option value="all">すべて</option>`+Object.keys(TOPICS).filter(k=>used.has(k)).map(k=>`<option value="${k}">${TOPICS[k]}</option>`).join("");
  if([...$("f-topic").options].some(o=>o.value===cur))$("f-topic").value=cur;
}
function pool(){
  const sv=$("f-step").value,t=$("f-topic").value,f=$("f-set").value;
  let inStep;
  if(sv==="auto"){const a=autoStep();inStep=w=>w.step===a||w.step===0||(w.step<a&&w.lv<SETTLED)}
  else if(sv==="all")inStep=()=>true;
  else{const n=+sv;inStep=w=>w.step===n}
  return words.filter(w=>inStep(w)&&(t==="all"||w.t===t)&&(f==="all"||(f==="weak"?w.lv<=2:w.lv<5)));
}
// lower level → picked more often
function pick(p,avoid){
  const c=p.length>1?p.filter(w=>w!==avoid):p;
  const tot=c.reduce((s,w)=>s+(6-w.lv),0);let r=Math.random()*tot;
  for(const w of c){r-=6-w.lv;if(r<=0)return w}return c[0];
}
function speak(t,slow){
  try{const lang=$("f-accent").value;const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=slow?.6:.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-")===lang);if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function grade(w,ok){w.lv=ok?Math.min(5,w.lv+1):Math.max(0,w.lv-2);save();stats()}
function emptyMsg(){return `<div class="empty">この条件に合う単語はありません。<br>レベル・トピック・出題の条件を広げてください。</div>`}
function tags(w){return `<span class="tags">${w.step?`<span class="chip st">Step ${w.step}</span>`:""}<span class="chip">${esc(TOPICS[w.t]||"")}</span></span>`}
function detail(w,withMean){
  const s=syns(w);
  return `${withMean?`<div class="mean">${esc(w.m)}</div>`:""}
  ${(s.length||w.col)?`<dl class="kv">${s.length?`<dt>言い換え</dt><dd class="en">${s.map(esc).join(" / ")}</dd>`:""}${w.col?`<dt>よく使う形</dt><dd class="en">${esc(w.col)}</dd>`:""}</dl>`:""}
  ${w.note?`<div class="note"><b>解説</b>${esc(w.note)}</div>`:""}
  ${w.ex?`<div class="ex">${w.ex}</div>`:""}`;
}

function stats(){
  const n=words.length,m=words.filter(w=>w.lv>=5).length,l=words.filter(w=>w.lv>=1&&w.lv<5).length,z=n-m-l;
  $("stat").textContent=`習得 ${m} / ${n} 語`;
  const pc=x=>n?x/n*100:0;
  $("bar").innerHTML=`<span style="width:${pc(m)}%;background:var(--good)"></span><span style="width:${pc(l)}%;background:var(--accent)"></span>`;
  $("legend").innerHTML=`<span><i style="background:var(--good)"></i>習得済み（習熟度5）${m}</span><span><i style="background:var(--accent)"></i>学習中 ${l}</span><span><i style="background:var(--line)"></i>未学習 ${z}</span>`;
  const now=autoStep();
  $("steps").innerHTML=[1,2,3].map(s=>{const st=stepStats(s);const p=st.n?st.settled/st.n*100:0;
    return `<button class="step ${s===now?"now":""}" data-step="${s}" aria-label="${STEPS[s].name}を練習する">
      <span class="t">${STEPS[s].name}${s===now?`<span class="here">いまここ</span>`:""}</span>
      <span class="b">${STEPS[s].band}</span>
      <span class="mini"><span style="width:${p}%;background:var(--good)"></span></span>
      <span class="n">定着 ${st.settled} / ${st.n}</span>
    </button>`}).join("");
}
$("steps").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(!b)return;$("f-step").value=b.dataset.step;if(mode==="list")show("card");else show(mode)});

/* ---------- card ---------- */
let mode="card",cur=null,flipped=false;
function nextCard(){const p=pool();cur=p.length?pick(p,cur):null;flipped=false;renderCard()}
function renderCard(){
  const v=$("v-card");
  if(!cur){v.innerHTML=emptyMsg();return}
  v.innerHTML=`<div class="card ${flipped?"open":""}" id="card" tabindex="0" role="button" aria-label="カードをめくる">
    <div class="meta">${tags(cur)}<span>習熟度 ${cur.lv}/5</span></div>
    <div class="word">${esc(cur.w)}</div>
    <div class="ipa">${cur.ipa?`/${esc(cur.ipa)}/`:""} <span>${esc(cur.pos||"")}</span> <button class="say" data-say>♪ 発音</button></div>
    ${flipped?`<div class="back">${detail(cur,true)}</div>`:""}
    <div class="hint">${flipped?"覚えていましたか？（← まだ ／ → 覚えた）":"タップして意味と解説を見る（スペースキー）"}</div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn no" id="b-no" ${flipped?"":"disabled"}>まだ ✕</button>
    <button class="btn yes" id="b-yes" ${flipped?"":"disabled"}>覚えた ○</button>
  </div>`;
  $("card").onclick=e=>{if(e.target.closest("[data-say]")){speak(cur.w);return}if(!flipped){flipped=true;renderCard()}};
  $("b-no").onclick=()=>{grade(cur,false);nextCard()};
  $("b-yes").onclick=()=>{grade(cur,true);nextCard()};
}

/* ---------- quiz: meaning or paraphrase ---------- */
let qs={n:0,ok:0,cur:null,done:false,type:"mean"};
function distractors(w,key){
  const mine=new Set(syns(w).map(s=>s.toLowerCase()));
  const ok=x=>x!==w&&!(w.g&&x.g===w.g)&&x.m!==w.m&&key(x)&&!syns(x).some(s=>mine.has(s.toLowerCase()))&&!mine.has(x.w.toLowerCase())&&!syns(x).map(s=>s.toLowerCase()).includes(w.w.toLowerCase());
  const tiers=[x=>x.pos===w.pos&&x.step===w.step,x=>x.pos===w.pos,()=>true];
  const out=[],seen=new Set([key(w)]);
  for(const tier of tiers){for(const x of shuffle(words.filter(x=>ok(x)&&tier(x)))){const k=key(x);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length===3)return out}}
  return out;
}
function nextQuiz(){
  const v=$("v-quiz");const para=qs.type==="para";
  const sel=`<label class="qtype">問題の種類<select id="q-type"><option value="mean"${para?"":" selected"}>意味を選ぶ（英語 → 日本語）</option><option value="para"${para?" selected":""}>言い換えを選ぶ（英語 → 英語）</option></select></label>`;
  const p=pool().filter(w=>!para||syns(w).length);
  const bind=()=>{$("q-type").onchange=e=>{qs.type=e.target.value;nextQuiz()}};
  if(!p.length){v.innerHTML=sel+emptyMsg();bind();return}
  const w=pick(p,qs.cur);qs.cur=w;qs.done=false;
  const ans=para?(x=>syns(x)[0]):(x=>x.m);
  const others=distractors(w,ans);
  if(others.length<3){v.innerHTML=sel+`<div class="empty">選択肢を作るには、単語が4語以上必要です。</div>`;bind();return}
  const opts=shuffle([w,...others]);
  v.innerHTML=sel+`<div class="q">
    <div class="meta"><span class="score">第${qs.n+1}問　正解 ${qs.ok}/${qs.n}</span>${tags(w)}</div>
    <div class="word">${esc(w.w)}</div>
    <div class="ipa">${w.ipa?`/${esc(w.ipa)}/`:""} <span>${esc(w.pos||"")}</span> <button class="say" data-say>♪ 発音</button></div>
    <div class="prompt">${para?"ほぼ同じ意味の言い換え（paraphrase）はどれ？":"正しい意味はどれ？"}</div>
    <div class="choices">${opts.map((o,i)=>`<button class="choice ${para?"en":""}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(ans(o))}</span></button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <button class="btn primary" id="q-next" style="margin-top:12px" hidden>次の問題 →</button>
  </div>`;
  bind();
  v.querySelector("[data-say]").onclick=()=>speak(w.w);
  v.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(qs.done)return;qs.done=true;
    const ok=opts[+b.dataset.i]===w;
    qs.n++;if(ok)qs.ok++;grade(w,ok);
    v.querySelectorAll(".choice").forEach((c,i)=>{if(opts[i]===w)c.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    $("fb").innerHTML=`<div>${ok?`<b style="color:var(--good)">正解！</b>`:`<b style="color:var(--bad)">不正解</b>`}　${esc(w.w)} ＝ ${esc(w.m)}</div>${detail(w,false)}`;
    $("q-next").hidden=false;$("q-next").focus();
  });
}
$("v-quiz").addEventListener("click",e=>{if(e.target.id==="q-next")nextQuiz()});

/* ---------- spelling (listening) ---------- */
let sp={cur:null,done:false,n:0,ok:0};
// IELTS accepts both British and American spellings
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ").replace(/[‐-―]/g,"-").replace(/is(?=e|ation|ed|ing)/g,"iz").replace(/yse/g,"yze");
function nextSpell(){
  const v=$("v-spell");const p=pool();
  if(!p.length){v.innerHTML=emptyMsg();return}
  const w=pick(p,sp.cur);sp.cur=w;sp.done=false;
  v.innerHTML=`<div class="q">
    <div class="meta"><span class="score">第${sp.n+1}問　正解 ${sp.ok}/${sp.n}</span>${tags(w)}</div>
    <div class="prompt">音声を聞いて、つづりを入力してください。IELTSのリスニングでは、スペルミスは不正解になります。</div>
    <div class="listen">
      <button class="btn primary" id="s-play">♪ 再生</button>
      <button class="btn" id="s-slow">ゆっくり再生</button>
    </div>
    <div class="ex">ヒント：${esc(w.pos||"")}　${esc(w.m)}</div>
    <form class="spell" id="s-form" autocomplete="off">
      <input id="s-in" aria-label="つづり" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the word">
      <button class="btn" id="s-check">答え合わせ</button>
    </form>
    <div class="feedback" id="s-fb"></div>
    <button class="btn primary" id="s-next" style="margin-top:12px" hidden>次の問題 →</button>
  </div>`;
  $("s-play").onclick=()=>{speak(w.w);$("s-in").focus()};
  $("s-slow").onclick=()=>{speak(w.w,true);$("s-in").focus()};
  $("s-next").onclick=nextSpell;
  $("s-form").onsubmit=e=>{e.preventDefault();
    if(sp.done){nextSpell();return}
    const val=$("s-in").value;if(!val.trim())return;
    sp.done=true;const ok=norm(val)===norm(w.w);
    sp.n++;if(ok)sp.ok++;grade(w,ok);
    $("s-in").classList.add(ok?"right":"wrong");$("s-in").readOnly=true;
    const t=w.w,g=val.trim();
    const marked=[...t].map((c,i)=>c.toLowerCase()===(g[i]||"").toLowerCase()?esc(c):`<span class="x">${esc(c)}</span>`).join("");
    $("s-fb").innerHTML=`<div>${ok?`<b style="color:var(--good)">正解！</b>　`:`<b style="color:var(--bad)">不正解</b>　正しいつづり：`}<span class="diff">${ok?esc(t):marked}</span></div>${detail(w,false)}`;
    $("s-next").hidden=false;$("s-check").disabled=true;$("s-next").focus();
  };
  setTimeout(()=>speak(w.w),250);
}

/* ---------- word list ---------- */
let listStep="all",listLimit=60;
function renderList(){
  const v=$("v-list");
  const keys=Object.keys(TOPICS).filter(k=>words.some(w=>w.t===k));
  const topicRows=keys.map(k=>{const ws=words.filter(w=>w.t===k),m=ws.filter(w=>w.lv>=SETTLED).length;
    return `<div class="trow"><span>${TOPICS[k]}</span><div class="mini"><span style="width:${m/ws.length*100}%;background:var(--good)"></span></div><span class="n">${m}/${ws.length}</span></div>`}).join("");
  const shown=words.filter(w=>listStep==="all"||String(w.step)===listStep).sort((a,b)=>(a.step||9)-(b.step||9)||a.lv-b.lv||a.w.localeCompare(b.w));
  const lvBars=w=>`<div class="lv" title="習熟度 ${w.lv}/5">${[1,2,3,4,5].map(n=>`<i class="${w.lv>=n?"on":""}"></i>`).join("")}</div>`;
  v.innerHTML=`<h3>トピック別の定着状況（習熟度3以上）</h3><div class="topics">${topicRows}</div>
  <form class="add" id="add">
    <h2>単語を追加</h2>
    <div class="two"><input id="a-w" placeholder="英単語（例：scarcity）" required><input id="a-m" placeholder="意味（例：不足）" required></div>
    <input id="a-syn" placeholder="言い換え（カンマ区切り、例：shortage, lack）">
    <input id="a-note" placeholder="メモ・解説（なくてもOK）">
    <input id="a-ex" placeholder="例文（なくてもOK）">
    <button class="btn primary">追加する</button>
  </form>
  <div class="lfilter"><h3>単語一覧（${shown.length}語）タップで解説</h3>
    <select id="l-step" aria-label="表示するステップ">
      <option value="all">すべて</option><option value="1">Step 1</option><option value="2">Step 2</option><option value="3">Step 3</option>${store.mine.length?`<option value="0">自分で追加</option>`:""}
    </select></div>
  <div class="list">${shown.slice(0,listLimit).map(w=>`<details class="item">
    <summary><span class="w">${esc(w.w)} ${tags(w)}</span>${lvBars(w)}<span class="m">${esc(w.m)}</span></summary>
    <div class="body">${w.ipa?`<div class="ipa">/${esc(w.ipa)}/ <span>${esc(w.pos||"")}</span> <button class="say" data-sayw="${esc(w.w)}">♪ 発音</button></div>`:""}${detail(w,false)}<button class="del" data-del="${esc(w.w)}">この単語を一覧から削除</button></div>
  </details>`).join("")}</div>
  ${shown.length>listLimit?`<button class="btn more" id="more" style="margin-top:12px;width:100%">さらに表示（残り${shown.length-listLimit}語）</button>`:""}
  <div class="row" style="margin-top:16px"><button class="btn" id="reset-lv">習熟度をリセット</button><button class="btn" id="reset-all">初期状態に戻す</button></div>`;
  $("l-step").value=listStep;
  $("l-step").onchange=e=>{listStep=e.target.value;listLimit=60;renderList()};
  $("more")?.addEventListener("click",()=>{listLimit+=80;renderList()});
  $("add").onsubmit=e=>{e.preventDefault();
    const w=$("a-w").value.trim(),m=$("a-m").value.trim();
    if(!w||!m)return;
    if(words.some(x=>x.w.toLowerCase()===w.toLowerCase())){$("a-w").setCustomValidity("この単語はすでに登録されています");$("a-w").reportValidity();setTimeout(()=>$("a-w").setCustomValidity(""),2000);return}
    let ex=esc($("a-ex").value.trim());
    const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");ex=ex.replace(re,"<b>$1</b>");
    store.mine.unshift({w,m,syn:$("a-syn").value.trim(),note:$("a-note").value.trim(),ex,col:"",ipa:"",pos:"",t:"mine",g:""});
    build();save();stats();fillTopics();renderList();$("a-w").focus()};
  v.querySelectorAll("[data-sayw]").forEach(b=>b.onclick=()=>speak(b.dataset.sayw));
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const k=b.dataset.del;
    if(store.mine.some(x=>x.w===k))store.mine=store.mine.filter(x=>x.w!==k);else store.del.push(k);
    build();save();stats();fillTopics();renderList()});
  armReset("reset-lv","もう一度押すとリセット",()=>{store.lv={};build()});
  armReset("reset-all","追加・削除も元に戻ります。もう一度押す",()=>{store={lv:{},mine:[],del:[]};build()});
}
function armReset(id,msg,fn){const b=$(id);let armed=false;const orig=b.textContent;
  b.onclick=()=>{if(!armed){armed=true;b.textContent=msg;b.classList.add("no");setTimeout(()=>{armed=false;b.textContent=orig;b.classList.remove("no")},3500);return}
    fn();save();stats();fillTopics();renderList()}}

/* ---------- routing ---------- */
function show(m){mode=m;
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  ["card","quiz","spell","list"].forEach(k=>$("v-"+k).hidden=k!==m);
  $("filters").hidden=m==="list";
  if(m==="card")nextCard();if(m==="quiz")nextQuiz();if(m==="spell")nextSpell();if(m==="list")renderList();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.mode));
["f-step","f-topic","f-set"].forEach(id=>$(id).onchange=()=>show(mode));
document.addEventListener("keydown",e=>{
  if(["INPUT","SELECT","SUMMARY"].includes(e.target.tagName))return;
  if(mode==="card"&&cur){
    if(e.key===" "&&!flipped){e.preventDefault();flipped=true;renderCard()}
    else if(flipped&&e.key==="ArrowRight"){grade(cur,true);nextCard()}
    else if(flipped&&e.key==="ArrowLeft"){grade(cur,false);nextCard()}
  }
  if(mode==="quiz"){const i="1234".indexOf(e.key);if(i>=0&&!qs.done)document.querySelectorAll(".choice")[i]?.click()}
});
try{speechSynthesis.getVoices()}catch(e){}
fillTopics();stats();show("card");
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
